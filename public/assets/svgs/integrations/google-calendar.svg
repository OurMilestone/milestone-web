<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
	<!-- Google Calendar logo -->
	<defs>
		<clipPath id="gcal-clip">
			<rect width="48" height="48" rx="10"/>
		</clipPath>
	</defs>

	<g clip-path="url(#gcal-clip)">
		<!-- Base -->
		<rect width="48" height="48" fill="#000"/>

		<!-- Top + left blue L -->
		<path fill="#4285F4" d="M0 0h40v9H9v39H0z"/>
		<!-- Top-right darker blue -->
		<rect x="39" y="0" width="9" height="9" fill="#1A73E8"/>
		<!-- Right yellow -->
		<rect x="39" y="9" width="9" height="30" fill="#F4B400"/>
		<!-- Bottom green -->
		<rect x="9" y="39" width="30" height="9" fill="#0F9D58"/>
		<!-- Bottom-left darker green -->
		<rect x="0" y="39" width="9" height="9" fill="#0B8043"/>
		<!-- Bottom-right red with fold -->
		<path fill="#DB4437" d="M39 39h9v9H39z"/>
		<path fill="#000" d="M48 48V39L39 48z"/>

		<!-- Center -->
		<rect x="9" y="9" width="30" height="30" fill="#000"/>
	</g>

	<!-- Day number -->
	<text
		x="24"
		y="31.5"
		text-anchor="middle"
		font-family="Arial, Helvetica, sans-serif"
		font-size="16"
		font-weight="700"
		fill="#4285F4"
	>31</text>
</svg>
